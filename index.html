function toggle(key) { state[key] = !state[key]; store.set(key, state[key]); render(); }
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
// Auto-hide by default; H pins the bar.
let barPinned = store.get('barPinned', false);
function toggleBar() {
  barPinned = !barPinned;
  store.set('barPinned', barPinned);
  flash(barPinned ? 'バーを常に表示' : 'バーを自動で隠す');
  showChrome();
}

let hideTimer;
function showChrome() {
  bar.classList.remove('hidden'); pageno.classList.remove('hidden');
  armHide();
}
// Re-armed whenever something that blocked hiding (hover, input focus, a flash) ends.
function armHide() {
  clearTimeout(hideTimer);
  if (barPinned) return;
  hideTimer = setTimeout(() => {
    if (bar.matches(':hover') || document.activeElement === $('src')) return;
    bar.classList.add('hidden'); pageno.classList.add('hidden');
  }, 2000);
}
document.addEventListener('mousemove', e => { if (!barPinned && e.clientY < 80) showChrome(); });
bar.addEventListener('mouseleave', armHide);
$('src').addEventListener('blur', armHide);

// Leading zeros mean fixed-width numbering (e.g. 003.jpg → width 3).
const padOf = s => (s.length > 1 && s[0] === '0' ? s.length : 0);

// Returns a source or an error string.
function parseInput(v) {
  const iid = v.match(/[?&]iid=(\d+)/);
  if (iid) return fc2Src(+(v.match(/[?&]aid=(\d+)/) || [])[1] || state.src.aid || 1, +iid[1]);
  if (/^\d+(\.\d)?$/.test(v)) return { ...state.src, ch: +v };
  // e.g. https://example.com/xxx/chapter-12/003.jpg, …/chapter-12.5/page_0.webp
  const m = v.match(/^(.*?chapter)([-_]?)(\d+)(\.\d)?(\D.*\D|\D)(\d+)\.(jpe?g|png|webp|gif|avif)(\?.*)?$/i);
  // Split ".../chapter_79" + "/page_" into the folder part and the file-name prefix.
  const slash = m && m[5].lastIndexOf('/');
  if (m) {
    const [tpl, hp] = splitHostPrefix(m[1] + '{sep}{ch}' + (slash >= 0 ? m[5].slice(0, slash + 1) + '{pp}' : m[5]) + '{p}.{ext}' + (m[8] || ''));
    return {
      tpl, hp, sep: m[2], pp: slash >= 0 ? m[5].slice(slash + 1) : undefined, ext: m[7],
      ch: +(m[3] + (m[4] || '')), chPad: padOf(m[3]), pad: padOf(m[6]), first: +m[6] === 0 ? 0 : 1,
    };
  }
  if (/chapter[-_]?\d+/i.test(v)) return 'ページ内の画像のURLを貼ってください（画像を右クリック →「画像アドレスをコピー」）';
  return 'URL か話数の番号を入力してください';
}

function openFromInput() {
  const src = parseInput($('src').value.trim());
  if (typeof src === 'string') return flash(src);
  $('src').blur();
  state.src = src;
  loadChapter(src.ch);
}

$('prevCh').onclick = () => chapter(-1);
$('nextCh').onclick = () => chapter(1);
$('dirBtn').onclick = () => toggle('rtl');
$('spreadBtn').onclick = () => toggle('spread');
$('coverBtn').onclick = () => toggle('cover');
$('fitBtn').onclick = () => toggle('fit');
$('skipFracsBtn').onclick = () => toggle('skipFracs');
$('pageBack').onclick = () => stepPage(-1);
$('pageFwd').onclick = () => stepPage(1);
$('fsBtn').onclick = toggleFullscreen;
$('listBtn').onclick = () => listsOpen() ? closeLists() : openLists();
$('chListBtn').onclick = () => listsOpen() && listTab === 'ch' ? closeLists() : openLists('ch');
bar.addEventListener('click', e => e.target.blur && e.target.tagName === 'BUTTON' && e.target.blur());

// Open in more than one tab, each tab saves its whole copy of a list; without this, a tab
// with an old copy (e.g. one running the new-chapter check) writes over what another saved.
// Re-reads one saved list into the copy this page works with; false if it isn't one.
function reloadKey(k) {
  const objs = { chapters: chapterCache, updates, seriesTitles, seriesAdded, seriesCovers };
  if (k === 'history') marks.history = store.get('history', []);
  else if (k === 'syncStamps') sync.stamps = store.get('syncStamps', null);
  else if (objs[k]) {
    const o = objs[k], v = store.get(k, {});
    for (const x of Object.keys(o)) delete o[x];
    Object.assign(o, v);
  } else return false;
  return true;
}
function rerenderAll() {
  refreshUpdates();
  if (homeOpen()) renderHome();
  if (listsOpen()) renderLists();
}
window.addEventListener('storage', ev => {
  const k = ev.key?.startsWith('mv.') && ev.key.slice(3);
  if (k && reloadKey(k) && k !== 'syncStamps') rerenderAll();
});

// ---- sync (GitHub Gist) --------------------------------------------------
// The series lists and history are kept in one secret gist, so every device (PC, phone)
// sees the same. Each entry (one history chapter, one series' title / chapter list / …)
// carries the time it last changed here; merging takes the newer side entry by entry, and
// a removed entry leaves its time behind so the removal wins over an older copy elsewhere.
const SYNC_KEYS = ['history', 'seriesTitles', 'seriesAdded', 'seriesCovers', 'chapters', 'updates'];
const SYNC_FILE = 'manga-viewer-sync.json';
const SYNC_EVERY = 5 * 60 * 1000, SYNC_DELAY = 8000, TOMB_KEEP = 90 * 864e5;
const sync = { token: store.get('syncToken', ''), gist: store.get('syncGist', ''), at: store.get('syncAt', 0),
  stamps: store.get('syncStamps', null), busy: false, again: false, timer: 0, err: '' };

const subsOf = (k, v) => k === 'history'
  ? Object.fromEntries((v || []).map(e => [seriesKey(e.src) + '|' + e.src.ch, e]))
  : { ...(v || {}) };
const fromSubs = (k, subs) => k === 'history' ? trimHistory(Object.values(subs)) : subs;
const saveStamps = () => { sync.applying = true; store.set('syncStamps', sync.stamps); sync.applying = false; };

// Called by store.set before a list is saved: stamp the entries that changed.
store.beforeSet = (k, v) => {
  if (!sync.token || sync.applying || !SYNC_KEYS.includes(k)) return;
  const prev = subsOf(k, store.get(k)), next = subsOf(k, v), st = (sync.stamps ||= {})[k] ||= {}, now = Date.now();
  let changed = false;
  for (const sub of new Set([...Object.keys(prev), ...Object.keys(next)]))
    if (JSON.stringify(prev[sub]) !== JSON.stringify(next[sub])) { st[sub] = now; changed = true; }
  if (changed) { saveStamps(); schedulePush(); }
};

// Entry by entry, the newer of here and the gist. pushNeeded: the gist lacks something.
function mergeRemote(remote) {
  const out = { v: 1, data: {}, stamps: {} }, cutoff = Date.now() - TOMB_KEEP;
  let pushNeeded = !remote?.data;
  for (const k of SYNC_KEYS) {
    const L = subsOf(k, store.get(k)), Ls = sync.stamps[k] || {};
    const R = remote?.data?.[k] || {}, Rs = remote?.stamps?.[k] || {};
    const D = {}, S = {};
    for (const sub of new Set([...Object.keys(L), ...Object.keys(Ls), ...Object.keys(R), ...Object.keys(Rs)])) {
      const lt = Ls[sub] || 0, rt = Rs[sub] || 0, val = rt > lt ? R[sub] : L[sub], ts = Math.max(lt, rt);
      if (val === undefined && ts < cutoff) { if (sub in Rs) pushNeeded = true; continue; } // long-gone: forget
      if (rt !== ts || JSON.stringify(val) !== JSON.stringify(R[sub])) pushNeeded = true;
      S[sub] = ts;
      if (val !== undefined) D[sub] = val;
    }
    if (k === 'history') { // the newest 100 + each series' newest; the rest count as removed
      const kept = subsOf(k, fromSubs(k, D));
      for (const sub of Object.keys(D)) if (!(sub in kept)) { delete D[sub]; S[sub] = Date.now(); pushNeeded = true; }
    }
    out.data[k] = D; out.stamps[k] = S;
  }
  return { out, pushNeeded };
}

function applyMerged(out) {
  let changed = false;
  sync.applying = true;
  try {
    for (const k of SYNC_KEYS) {
      const cur = subsOf(k, store.get(k)), next = out.data[k];
      const same = Object.keys(cur).length === Object.keys(next).length &&
        Object.keys(next).every(s => JSON.stringify(cur[s]) === JSON.stringify(next[s]));
      if (same) continue;
      store.set(k, fromSubs(k, next));
      reloadKey(k);
      changed = true;
    }
  } finally { sync.applying = false; }
  sync.stamps = out.stamps;
  saveStamps();
  if (changed) rerenderAll();
}

async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: {
    Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json',
    ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) {
    const err = new Error(r.status === 401 ? '合言葉（トークン）が正しくないか、期限切れです'
      : r.status === 403 || r.status === 404 && !sync.gist ? 'トークンに gist の権限がありません' : `GitHub エラー ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return r.json();
}
// The gist made by another device, found by its file name; else a new secret one.
async function ensureGist() {
  if (sync.gist) return;
  for (let page = 1; page <= 10 && !sync.gist; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    sync.gist = list.find(g => g.files?.[SYNC_FILE])?.id || '';
    if (list.length < 100) break;
  }
  if (!sync.gist) sync.gist = (await gh('/gists', { method: 'POST', body: JSON.stringify({
    description: '見開きビューアの同期データ', public: false, files: { [SYNC_FILE]: { content: '{}' } } }) })).id;
  store.set('syncGist', sync.gist);
}
async function readGist() {
  const f = (await gh(`/gists/${sync.gist}`)).files?.[SYNC_FILE];
  if (!f) return null;
  const text = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
  try { return JSON.parse(text); } catch { return null; }
}

async function syncNow(manual = false) {
  clearTimeout(sync.timer);
  if (!sync.token) return;
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true; sync.err = ''; renderSync();
  try {
    for (let attempt = 0; ; attempt++) {
      try {
        await ensureGist();
        const { out, pushNeeded } = mergeRemote(await readGist());
        applyMerged(out); // no waiting between the merge and this: nothing changes in between
        if (pushNeeded) await gh(`/gists/${sync.gist}`, { method: 'PATCH',
          body: JSON.stringify({ files: { [SYNC_FILE]: { content: JSON.stringify(out) } } }) });
        break;
      } catch (err) {
        // The gist was deleted: look for (or make) another once.
        if (err.status === 404 && sync.gist && !attempt) { sync.gist = ''; store.set('syncGist', ''); continue; }
        throw err;
      }
    }
    sync.at = Date.now(); store.set('syncAt', sync.at);
    if (manual) flash('同期しました');
  } catch (err) {
    sync.err = err.message || String(err);
    if (manual) alert('同期できませんでした\n' + sync.err);
  } finally {
    sync.busy = false;
    renderSync();
    if (sync.again) { sync.again = false; schedulePush(); }
  }
}
function schedulePush() {
  clearTimeout(sync.timer);
  if (sync.token) sync.timer = setTimeout(syncNow, SYNC_DELAY);
}

function renderSync() {
  const b = $('syncBtn');
  b.textContent = !sync.token ? '同期の設定' : sync.busy ? '同期中…' : sync.err ? '同期 ⚠' : `同期 ${sync.at ? new Date(sync.at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : ''}`;
  b.title = !sync.token ? 'PC・スマホで作品一覧と履歴を共有する（GitHub Gist）'
    : sync.err ? `同期できていません：${sync.err}\n押すともう一度試します` : '押すと今すぐ同期します';
  b.classList.toggle('new', !!sync.err);
  $('syncSet').style.display = sync.token ? '' : 'none';
}
function setupSync() {
  const t = prompt(
    'PC・スマホで作品一覧と履歴を共有します（GitHub の非公開メモ＝Gist に保存）。\n\n' +
    '1. GitHub にログインし、Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token (classic)\n' +
    '2. 権限は「gist」だけにチェックして作成\n' +
    '3. 表示されたトークン（ghp_…）をここに貼り付け\n\n' +
    'ほかの端末でも同じトークンを入れると、同じデータを共有します。' +
    (sync.token ? '\n空欄にすると、この端末の同期を止めます（データは残ります）。' : ''), '');
  if (t === null) return;
  const token = t.trim();
  if (!token) {
    if (!sync.token || !confirm('この端末の同期を止めますか？')) return;
    Object.assign(sync, { token: '', gist: '', err: '' });
    for (const k of ['syncToken', 'syncGist', 'syncStamps']) localStorage.removeItem('mv.' + k);
    return renderSync();
  }
  const first = !sync.token;
  Object.assign(sync, { token, gist: '', err: '' });
  store.set('syncToken', token); store.set('syncGist', '');
  if (first || !sync.stamps) {
    // What's here so far counts as old: where the gist already has an entry, the gist's wins.
    sync.stamps = {};
    for (const k of SYNC_KEYS) sync.stamps[k] = Object.fromEntries(Object.keys(subsOf(k, store.get(k))).map(s => [s, 1]));
    saveStamps();
  }
  syncNow(true);
}
$('syncBtn').onclick = () => !sync.token ? setupSync() : syncNow(true);
$('syncSet').onclick = setupSync;
renderSync();

// ---- start ---------------------------------------------------------------

// Start on the home screen when there is anything to list; otherwise straight into reading.
if (marks.history.length) openHome();
else loadChapter(state.src.ch, store.get('pos', 0), store.get('anchor', -1));
showChrome();
refreshUpdates();
// New-chapter check: shortly after opening (unless one ran recently), then periodically.
setTimeout(() => { if (Date.now() - store.get('updatesAt', 0) >= UPDATE_EVERY) checkUpdates(); }, 5000);
setInterval(checkUpdates, UPDATE_EVERY);
// Installed as an app (web version only; opened as a local file there's nothing to install).
if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Back on screen after a while (phones pause hidden pages): catch up on the new-chapter check.
// Sync: on opening, every few minutes, and whenever the page is shown or hidden again.
setTimeout(syncNow, 1500);
setInterval(syncNow, SYNC_EVERY);
document.addEventListener('visibilitychange', () => {
  syncNow();
  if (!document.hidden && Date.now() - store.get('updatesAt', 0) >= UPDATE_EVERY) checkUpdates();
});
</script>
</body>
